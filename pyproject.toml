[project]
name = "cipherkit"
version = "0.1.0"
description = "Shared solver pieces for the unsolved-ciphers repo: language models, annealing, matched controls, transcription parsing."
requires-python = ">=3.12"
dependencies = ["pillow>=10"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cipherkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
