name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run python ferdinand-1635-1640/verify.py
      - run: uv run python moray-1568/verify.py
      - run: uv run python moray-1568/fresh_review.py
      - run: uv run python docs/_build_site.py
      - run: git diff --exit-code -- docs/
