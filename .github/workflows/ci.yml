name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run python ferdinand-1635-1640/verify.py
      - run: uv run python moray-1568/verify.py
      - run: uv run python moray-1568/fresh_review.py
      - run: uv run python vande-perre-1653/verify.py
      - run: uv run python vande-perre-1653/further-review/verify_review.py
      - run: uv run python ottobon-1589/decode.py --check
      - run: uv run python forster-1644/verify_solution.py > /dev/null
      - run: uv run python starhemberg-1758/run_checks.py
      - run: git diff --exit-code -- ottobon-1589 forster-1644 starhemberg-1758
      - run: uv run python docs/_build_site.py
      - run: git diff --exit-code -- docs/
